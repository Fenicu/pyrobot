name: Проверки, сборка и выкатка pyrobot

on:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: git.fenicu.com/fenicu/pyrobot

jobs:
  lint:
    runs-on: docker
    container:
      image: ghcr.io/astral-sh/uv:debian-slim
    timeout-minutes: 10
    env:
      # devpi хоумлаба. uv sync берёт файлы строго по адресам uv.lock (PyPI) и при другом индексе
      # переписал бы lock: пакеты — экспортом версий и хешей из uv.lock через uv pip sync.
      UV_DEFAULT_INDEX: http://10.10.40.8:3141/root/pypi/+simple/
    steps:
      - name: Получить исходники
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
          AUTH_URL="$(echo "${{ github.server_url }}/${{ github.repository }}.git" \
            | sed "s|https://|https://ci:${{ secrets.GITEA_TOKEN }}@|")"
          git init -q . && git remote add origin "$AUTH_URL"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - name: Компилятор для сборки tgcrypto
        run: apt-get install -y -qq --no-install-recommends build-essential
      - name: ruff
        run: |
          uvx --from 'ruff==0.16.9' ruff check .
          uvx --from 'ruff==0.16.9' ruff format --check .
      - name: mypy
        run: |
          uv export --frozen --no-emit-project --no-header -q -o /tmp/requirements.txt
          uv venv -q && uv pip sync -q --require-hashes /tmp/requirements.txt
          uv run --no-sync mypy

  test:
    runs-on: docker
    container:
      image: ghcr.io/astral-sh/uv:debian-slim
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pyrobot_test
          POSTGRES_USER: pyrobot
          POSTGRES_PASSWORD: pyrobot
    env:
      # devpi хоумлаба, как в lint.
      UV_DEFAULT_INDEX: http://10.10.40.8:3141/root/pypi/+simple/
      PYROBOT_TEST_DATABASE_URL: "postgresql+asyncpg://pyrobot:pyrobot@postgres:5432/pyrobot_test"
      PYROBOT_TEST_MIGRATIONS_URL: "postgresql+asyncpg://pyrobot:pyrobot@postgres:5432/pyrobot_migtest"
      # open()/read_text() без encoding — EncodingWarning, а в pytest предупреждения — ошибки.
      PYTHONWARNDEFAULTENCODING: "1"
    steps:
      - name: Получить исходники
        run: |
          echo 'Acquire::http::Proxy "http://10.10.40.23:3142";' > /etc/apt/apt.conf.d/00proxy
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates postgresql-client
          AUTH_URL="$(echo "${{ github.server_url }}/${{ github.repository }}.git" \
            | sed "s|https://|https://ci:${{ secrets.GITEA_TOKEN }}@|")"
          git init -q . && git remote add origin "$AUTH_URL"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - name: Компилятор для сборки tgcrypto
        run: apt-get install -y -qq --no-install-recommends build-essential
      - name: Дождаться PostgreSQL и создать базу миграций
        run: |
          for i in $(seq 1 30); do pg_isready -h postgres -U pyrobot && break; sleep 2; done
          PGPASSWORD=pyrobot psql -h postgres -U pyrobot -d pyrobot_test -c "CREATE DATABASE pyrobot_migtest"
      - name: pytest
        run: |
          uv export --frozen --no-emit-project --no-header -q -o /tmp/requirements.txt
          uv venv -q && uv pip sync -q --require-hashes /tmp/requirements.txt
          uv run --no-sync pytest -q -m "not corpus"

  # Админка: типы API сверяются с openapi.json, svelte-check, vitest и сборка статики.
  admin:
    runs-on: docker
    container:
      image: node:24-bookworm-slim
    timeout-minutes: 15
    env:
      # verdaccio хоумлаба: npm ci берёт пакеты из него вместо registry.npmjs.org из lock-файла
      npm_config_registry: http://10.10.40.8:4873/
    steps:
      - name: Получить исходники
        run: |
          # apt-cacher-ng хоумлаба: прямой канал до deb.debian.org нестабилен
          echo 'Acquire::http::Proxy "http://10.10.40.23:3142";' > /etc/apt/apt.conf.d/00proxy
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
          AUTH_URL="$(echo "${{ github.server_url }}/${{ github.repository }}.git" \
            | sed "s|https://|https://ci:${{ secrets.GITEA_TOKEN }}@|")"
          git init -q . && git remote add origin "$AUTH_URL"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - name: Зависимости
        run: cd admin && npm ci --no-audit --no-fund
      - name: TS-типы API актуальны
        run: |
          cd admin
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts || {
            echo "schema.d.ts отстал от openapi.json: npm run gen:api и закоммитить" >&2
            exit 1
          }
      - name: svelte-check
        run: cd admin && npm run check
      - name: vitest
        run: cd admin && npm run test
      - name: Сборка
        run: cd admin && npm run build

  # Образ собирается на каждый push (ловит поломку Dockerfile), в registry уходит только по тегу vX.Y.Z.
  image:
    runs-on: self-hosted
    needs: [lint, test, admin]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Сборка образа, по тегу — публикация в registry
        env:
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
          TAG: ${{ github.ref_name }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          B="builder-pyrobot"
          # Свой builder на BuildKit, не зависящий от настроек демона; без --use, чтобы не
          # переключать общий для хоста текущий builder.
          docker buildx create --name "$B" --driver docker-container 2>/dev/null || true
          # Без тега результат остаётся только в кэше builder'а: проверка, что образ собирается.
          OUTPUT=(--output type=cacheonly)
          if [ "$PUBLISH" = "true" ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z"; exit 1; }
            echo "$REGISTRY_TOKEN" | docker login git.fenicu.com -u "$REGISTRY_USER" --password-stdin
            OUTPUT=(--push -t "$IMAGE:$TAG" -t "$IMAGE:latest")
          fi
          # Прокси apt, verdaccio и devpi хоумлаба; без них образ собирается из публичных источников.
          docker buildx build --builder "$B" --platform linux/amd64 --provenance=false \
            --build-arg APT_PROXY=http://10.10.40.23:3142 \
            --build-arg NPM_REGISTRY=http://10.10.40.8:4873/ \
            --build-arg PYPI_INDEX=http://10.10.40.8:3141/root/pypi/+simple/ \
            "${OUTPUT[@]}" .

  # Выкатка на apps по тегу: compose.yml, .env из секретов и скрипт выкатки по ssh, дальше на apps
  # pull → migrate → up → ожидание /readyz (deploy/remote-deploy.sh).
  deploy:
    runs-on: self-hosted
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20
    concurrency:
      group: deploy-pyrobot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Выкатка на apps
        env:
          TAG: ${{ github.ref_name }}
          APPS: fenicu@10.10.40.20
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.PYROBOT_DB_PASSWORD }}
          PYROBOT_TG_API_ID: ${{ secrets.PYROBOT_TG_API_ID }}
          PYROBOT_TG_API_HASH: ${{ secrets.PYROBOT_TG_API_HASH }}
          # Ключ шифрования сессий Telegram: постоянный (другой ключ не расшифрует сессии в базе),
          # хранится отдельно от бэкапов базы; render-env.sh его не генерирует.
          PYROBOT_SECRET_KEY: ${{ secrets.PYROBOT_SECRET_KEY }}
          # Нужен только первому старту (создание админа); дальше пароль меняется через API.
          PYROBOT_ADMIN_PASSWORD: ${{ secrets.PYROBOT_ADMIN_PASSWORD }}
          # Переменная репозитория: true — после выкатки ждать только живости процесса (/healthz), без
          # готовности (/readyz). Для первого выката больше не нужна: /readyz — готовность процесса
          # (база и блокировки хоста), от входа в Telegram не зависит; осталась аварийным обходом.
          SKIP_READY: ${{ vars.PYROBOT_SKIP_READY }}
        run: |
          # .env на apps пересоздаётся целиком: пустой секрет дал бы бота в цикле падений уже после
          # миграций — отказ до любых действий на сервере.
          if [ -z "${PYROBOT_SECRET_KEY:-}" ]; then
            echo "Секрет репозитория PYROBOT_SECRET_KEY пуст: без ключа шифрования сессий Telegram бот не стартует. Заведи его (README, «Переход с версии с одним аккаунтом») и повтори выкатку." >&2
            exit 1
          fi
          KEY="$(mktemp)"
          ENV_FILE="$(mktemp)"
          trap 'rm -f "$KEY" "$ENV_FILE"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          # .env пересоздаётся целиком; значения — в литеральной форме Compose (render-env.sh),
          # чтобы `$` в секретах не интерполировался.
          # Адрес apps в VLAN (к нему ходит Caddy с web), порт 8089 и доверие Caddy — явно: в
          # compose.yml умолчания для обычного сервера (127.0.0.1:8080).
          export PYROBOT_IMAGE="$IMAGE:$TAG" PYROBOT_TRANSPORT=kurigram PYROBOT_ADMIN_LOGIN=admin \
            PYROBOT_COOKIE_SECURE=true PYROBOT_LOG_LEVEL=INFO PYROBOT_FORWARDED_ALLOW_IPS=10.10.40.3 \
            PYROBOT_BIND=10.10.40.20 PYROBOT_PORT=8089
          bash deploy/render-env.sh PYROBOT_IMAGE POSTGRES_PASSWORD PYROBOT_TRANSPORT \
            PYROBOT_TG_API_ID PYROBOT_TG_API_HASH PYROBOT_ADMIN_LOGIN PYROBOT_ADMIN_PASSWORD \
            PYROBOT_SECRET_KEY PYROBOT_COOKIE_SECURE PYROBOT_LOG_LEVEL \
            PYROBOT_FORWARDED_ALLOW_IPS PYROBOT_BIND PYROBOT_PORT > "$ENV_FILE"
          OPTS=(-i "$KEY" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)
          ssh "${OPTS[@]}" "$APPS" 'mkdir -p ~/pyrobot'
          scp "${OPTS[@]}" compose.yml deploy/remote-deploy.sh "$APPS:pyrobot/"
          scp "${OPTS[@]}" "$ENV_FILE" "$APPS:pyrobot/.env"
          ssh "${OPTS[@]}" "$APPS" "SKIP_READY=${SKIP_READY:-false} bash ~/pyrobot/remote-deploy.sh"
