services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pyrobot
      POSTGRES_PASSWORD: pyrobot
      POSTGRES_DB: pyrobot
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata: {}
