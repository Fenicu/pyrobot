# pyrobot: бот с админкой, одноразовые миграции и Postgres. Настройки — в .env
# рядом (шаблон — .env.example), установка по шагам — README «Установка».
name: pyrobot

x-app: &app
  image: ${PYROBOT_IMAGE:-git.fenicu.com/fenicu/pyrobot:latest}
  env_file: .env
  environment:
    PYROBOT_DATABASE_URL: postgresql+asyncpg://pyrobot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/pyrobot
    # X-Forwarded-For — только от шлюза сети проекта: с его адреса в контейнер приходит прокси на
    # этом же сервере (адрес бот берёт из маршрута по умолчанию при старте).
    PYROBOT_FORWARDED_ALLOW_IPS: ${PYROBOT_FORWARDED_ALLOW_IPS:-gateway}
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  pyrobot:
    <<: *app
    # Готовый образ — docker compose pull; сборка из исходников — docker compose build
    # (тогда в .env PYROBOT_IMAGE=pyrobot:local).
    build: .
    restart: unless-stopped
    # Один процесс на базу: каждый аккаунт ведёт тот, кто держит его аренду в базе; второй
    # экземпляр на той же базе движки занятых аккаунтов не запустит.
    ports:
      - "${PYROBOT_BIND:-127.0.0.1}:${PYROBOT_PORT:-8080}:8080"
    volumes:
      - pyrobot-data:/data
    stop_grace_period: 30s
    # Предохранитель: при утечке OOM убивает бота, а не соседей по серверу.
    mem_limit: 1g

  # Миграции базы — перед первым запуском и после каждого обновления: docker compose run --rm migrate
  migrate:
    <<: *app
    profiles: ["migrate"]
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  postgres:
    image: postgres:17
    restart: unless-stopped
    # Память — под небольшую базу; у бота до 10 соединений (пул 6 + 4), у миграций и дампа по одному.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
    environment:
      POSTGRES_USER: pyrobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: pyrobot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyrobot -d pyrobot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pyrobot-data: {}
  pgdata: {}
