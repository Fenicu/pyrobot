[project]
name = "pyrobot"
version = "0.1.0"
description = "Client telegram bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.10",
    "apscheduler>=3.11.0",
    "pyrofork>=2.3.48",
    "tgcrypto-pyrofork>=1.2.7",
    "sentry-sdk>=2.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.coverage.run]
source = ["app"]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]

