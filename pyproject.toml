[project]
name = "pyrobot"
version = "0.1.0"
description = "Userbot для автоматической игры в StartupWars"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kurigram>=2.2.26,<2.3",
    "tgcrypto>=1.2.5",
    "fastapi>=0.141",
    "uvicorn>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "argon2-cffi>=25.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "ruff==0.16.9",
    "mypy>=2.3",
]

# PyPI — явно: зеркало по умолчанию из ~/.config/uv/uv.toml тогда не делает uv.lock устаревшим, и
# uv sync/uv run его не переписывают. Своё зеркало — README «Разработка».
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "db: требует Postgres (docker compose -f compose.dev.yml up -d)",
    "corpus: требует ~/pyrobot-research",
]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.db.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# kurigram помечен py.typed, но его пакет raw не реэкспортирует символы через __all__
module = ["pyrogram.*"]
implicit_reexport = true
